<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>입장 신청 · 모노라마 트래커</title>
<!-- PWA: 프로젝트별 manifest (스크립트에서 serial 적용) -->
<link rel="manifest" id="manifest-link" href="/visitor/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스탬프투어">
<meta name="theme-color" content="#15803d">
<link rel="icon" href="/favicon-green.svg" type="image/svg+xml">
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", -apple-system, sans-serif; background: #f0f4f9; min-height: 100vh; color: #1e293b; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 18px 48px; }
  .header { text-align: center; margin-bottom: 18px; }
  .header .title { font-size: 20px; font-weight: 800; color: #1e293b; }
  .header .mode-badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; display: inline-block; margin-top: 8px; }
  .header .mode-badge.r { background: #bbf7d0; color: #166534; }
  .header .mode-badge.e { background: #bbf7d0; color: #166534; }
  .benefit-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(20,30,60,.06); }
  .benefit-card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: block; }
  .benefit-card .amt { font-size: 26px; font-weight: 800; color: #15803d; }
  .benefit-card .lbl { font-size: 14px; color: #475569; margin-top: 4px; }
  .form-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .row { margin-bottom: 14px; }
  .row label { display: block; font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
  .row .req { color: #dc2626; margin-left: 2px; }
  .row input[type=text], .row input[type=email], .row input[type=date],
  .row input[type=tel], .row input[type=time], .row input[type=number] {
    width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; outline: none; font-family: inherit; background: #fff;
  }
  .row input:focus { border-color: #15803d; }
  .row input:disabled { background: #f1f5f9; color: #94a3b8; }
  /* 각 form item 앞 green mid-point */
  .row > label::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #15803d; vertical-align: middle; margin-right: 8px;
  }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid #e2e8f0;
             border-radius: 8px; cursor: pointer; user-select: none; background: #f8fafc; }
  .opt-row:hover { border-color: #86efac; }
  .opt-row.checked { border-color: #15803d; background: #dcfce7; font-weight: 700; color: #166534; }
  .opt-row input { width: 18px; height: 18px; accent-color: #15803d; cursor: pointer; }
  .row.verify { border: 1.5px solid #15803d; background: #f0fdf4; border-radius: 10px; padding: 12px; }
  .row.verify label { color: #166534; }
  .verify-line { display: flex; gap: 6px; }
  .verify-line input { flex: 1; }
  .verify-line button { padding: 0 14px; font-size: 12px; font-weight: 700; border: none; border-radius: 8px;
                         background: #15803d; color: #fff; cursor: pointer; white-space: nowrap; }
  .verify-line button:disabled { background: #94a3b8; cursor: not-allowed; }
  /* 주소 입력 */
  .addr-box { display: flex; flex-direction: column; gap: 6px; }
  .addr-line { display: flex; gap: 6px; }
  .addr-line input { flex: 1; }
  .addr-line button { padding: 0 14px; font-size: 12px; font-weight: 700; border: none; border-radius: 8px;
                      background: #15803d; color: #fff; cursor: pointer; white-space: nowrap; }
  .addr-line button:disabled { background: #94a3b8; cursor: not-allowed; }
  .addr-mapnote { font-size: 11px; color: #94a3b8; text-align: center; padding: 8px; background: #f8fafc;
                  border: 1px dashed #cbd5e1; border-radius: 6px; }
  .addr-map { width: 100%; height: 220px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .addr-map-link { display: block; text-align: center; font-size: 12px; color: #15803d; padding: 10px;
                   background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; text-decoration: none;
                   font-weight: 600; }
  .addr-map-link:hover { background: #dcfce7; }
  /* 주소 검색 오버레이 (embed 모드) */
  .pc-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 9999;
                display: none; align-items: center; justify-content: center; padding: 10px; }
  .pc-overlay.open { display: flex; }
  .pc-modal { background: #fff; width: 100%; max-width: 560px; height: 90vh; max-height: 720px;
              border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
              box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .pc-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
             border-bottom: 1px solid #e2e8f0; background: #f0fdf4; flex-shrink: 0; }
  .pc-head h3 { font-size: 15px; font-weight: 800; color: #166534; margin: 0; }
  .pc-close { background: none; border: none; font-size: 22px; color: #64748b; cursor: pointer; padding: 2px 8px; }
  .pc-close:hover { color: #1e293b; }
  .pc-frame { flex: 1 1 auto; min-height: 480px; overflow: hidden; position: relative; }
  .pc-frame > * { width: 100% !important; height: 100% !important; border: 0 !important; }
  /* 인증코드 입력 + 눈 아이콘 토글 */
  .code-input-wrap { position: relative; flex: 1; }
  .code-input-wrap input { width: 100%; padding-right: 42px;
    -webkit-text-security: disc; /* iOS/Safari masking */ }
  .code-input-wrap input.show-text { -webkit-text-security: none; }
  /* 브라우저 기본 비밀번호 reveal 숨김 */
  .code-input-wrap input::-ms-reveal, .code-input-wrap input::-ms-clear { display: none; }
  .code-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
              background: none; border: none; cursor: pointer; padding: 6px;
              color: #64748b; font-size: 16px; display: flex; align-items: center; }
  .code-eye:hover { color: #15803d; }
  .code-eye:disabled { color: #cbd5e1; cursor: not-allowed; }
  .verify-msg { font-size: 11px; color: #64748b; margin-top: 8px; }
  .verify-msg.ok { color: #15803d; font-weight: 700; }
  .verify-msg.err { color: #dc2626; font-weight: 700; }
  .locked { position: relative; }
  .locked::after {
    content: '🔒 이메일 인증 후 입력 가능합니다';
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(248,250,252,0.88); color: #64748b; font-size: 14px; font-weight: 700;
    border-radius: 8px;
  }
  .submit { width: 100%; margin-top: 6px; padding: 14px; background: #15803d; color: #fff;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .submit:disabled { background: #94a3b8; cursor: not-allowed; }
  .submit:not(:disabled):hover { background: #166534; }
  .loading, .error-box { text-align: center; padding: 48px 18px; color: #64748b; font-size: 14px; }
  .error-box .err-title { font-size: 18px; font-weight: 700; color: #dc2626; margin-bottom: 10px; }
  .disabled-banner { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 8px;
                     padding: 10px 12px; font-size: 13px; text-align: center; margin-bottom: 14px; }
  .footer-note { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 16px; }
  .onsite-consent { display: none; margin: 14px 0; padding: 14px; border: 1.5px solid #86efac;
                    background: #f0fdf4; border-radius: 10px; }
  .onsite-consent.open { display: block; }
  .onsite-consent h3 { margin-bottom: 5px; color: #166534; font-size: 15px; }
  .onsite-consent .consent-sub { margin-bottom: 12px; color: #475569; font-size: 12px; line-height: 1.55; }
  .onsite-consent details { margin-bottom: 8px; border: 1px solid #d1fae5; border-radius: 8px; background: #fff; }
  .onsite-consent summary { padding: 10px 12px; color: #166534; font-size: 12px; font-weight: 700; cursor: pointer; }
  .onsite-consent .consent-doc { padding: 0 12px 11px; color: #475569; font-size: 11px; line-height: 1.65; }
  .onsite-consent .consent-check { display: flex; align-items: flex-start; gap: 8px; padding: 9px 4px;
                                   color: #1e293b; font-size: 12px; font-weight: 600; cursor: pointer; }
  .onsite-consent .consent-check.all { margin-top: 8px; border-top: 1px solid #bbf7d0; color: #166534; font-weight: 800; }
  .onsite-consent .consent-check input { width: 17px; height: 17px; margin-top: 1px; accent-color: #15803d; flex-shrink: 0; }
  .onsite-consent .consent-next { width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 8px;
                                  background: #15803d; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  .onsite-consent .consent-next:disabled { background: #94a3b8; cursor: not-allowed; }
  /* 완료 뷰 */
  .done-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 22px; text-align: center; }
  .done-card h2 { font-size: 18px; color: #15803d; margin-bottom: 14px; }
  .done-card .qr-box { background: #fff; border: 1.5px dashed #86efac; border-radius: 12px; padding: 12px; display: inline-block; margin: 8px 0 16px; }
  .done-card .qr-box img { width: 220px; height: 220px; display: block; }
  .done-card .btn-row { display: flex; gap: 8px; }
  .done-card .btn-row > * { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
                            border: none; cursor: pointer; text-decoration: none; }
  .done-card .btn-save { background: #15803d; color: #fff; }
  .done-card .btn-visit { background: #f59e0b; color: #fff; }
  .done-card .done-tip { font-size: 12px; color: #64748b; line-height: 1.6; margin-top: 12px; }

  /* 커스텀 알림창 모달 */
  .custom-alert-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(1.5px);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.15s ease-out;
  }
  .custom-alert-overlay.open {
    display: flex;
    opacity: 1;
  }
  .custom-alert-modal {
    background: #fff;
    width: 100%;
    max-width: 360px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    transform: scale(0.9);
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  .custom-alert-overlay.open .custom-alert-modal {
    transform: scale(1);
  }
  .custom-alert-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #dcfce7;
    color: #15803d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .custom-alert-title {
    font-size: 16px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 8px;
  }
  .custom-alert-message {
    font-size: 14px;
    color: #475569;
    line-height: 1.6;
    margin-bottom: 20px;
    word-break: keep-all;
  }
  .custom-alert-btn {
    width: 100%;
    padding: 12px;
    background: #15803d;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .custom-alert-btn:hover {
    background: #166534;
  }
  .custom-alert-btn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <a id="back-menu" href="#" style="display:inline-flex;align-items:center;gap:4px;color:#15803d;text-decoration:none;font-size:12px;font-weight:600;">◀ 메뉴로</a>
    <button id="close-x" type="button" title="닫기" style="background:#fff;border:1.5px solid #cbd5e1;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:#475569;line-height:1;">×</button>
  </div>
  <div class="loading" id="loading">불러오는 중…</div>
</div>

<!-- 주소 검색 오버레이 (embed 모드) -->
<div class="pc-overlay" id="pc-overlay" onclick="if(event.target===this)closePostcode()">
  <div class="pc-modal">
    <div class="pc-head">
      <h3>주소 검색</h3>
      <button type="button" class="pc-close" onclick="closePostcode()" aria-label="닫기">×</button>
    </div>
    <div class="pc-frame" id="pc-frame"></div>
  </div>
</div>

<!-- 커스텀 알림창 모달 -->
<div class="custom-alert-overlay" id="custom-alert" onclick="if(event.target===this)closeCustomAlert()">
  <div class="custom-alert-modal">
    <div class="custom-alert-icon">✓</div>
    <div class="custom-alert-title">알림</div>
    <div class="custom-alert-message" id="custom-alert-message"></div>
    <button type="button" class="custom-alert-btn" id="custom-alert-btn" onclick="closeCustomAlert()">확인</button>
  </div>
</div>

<script>
let customAlertCallback = null;
function showCustomAlert(msg, callback) {
  const alertOverlay = document.getElementById('custom-alert');
  const alertMsg = document.getElementById('custom-alert-message');
  alertMsg.innerText = msg;
  customAlertCallback = callback;
  alertOverlay.classList.add('open');
}
function closeCustomAlert() {
  const alertOverlay = document.getElementById('custom-alert');
  alertOverlay.classList.remove('open');
  if (typeof customAlertCallback === 'function') {
    const cb = customAlertCallback;
    customAlertCallback = null;
    cb();
  }
}

// 기존 alert()를 커스텀 알림창으로 호환될 수 있도록 오버라이드 (콜백 없이 단순 알림용)
window.alert = function(msg) {
  showCustomAlert(msg);
};

const isReserve = location.pathname.startsWith('/reserve/');
const mode = isReserve ? 'r' : 'e';
const modeLabel = isReserve ? '사전등록' : '현장등록';
const serial = location.pathname.split('/').filter(Boolean)[1] || '';
// 출처 — landing 에서 왔으면 메뉴로 = 랜딩 #menu, 아니면 visitor 앱
const FROM_LANDING = new URLSearchParams(location.search).get('from') === 'landing';
const MENU_URL = serial ? (FROM_LANDING ? `/landing/${serial}#menu` : `/v/${serial}`) : '/';
function sameOriginVisitorUrl(value) {
  const fallback = serial ? `/v/${encodeURIComponent(serial)}` : '/';
  if (!value) return fallback;
  try {
    const parsed = new URL(String(value), location.origin);
    return `${parsed.pathname}${parsed.search}${parsed.hash}`;
  } catch (e) {
    return fallback;
  }
}
// 랜딩 iframe 모달로 임베드(embed=1)된 경우 — '메뉴로/닫기' 는 부모 모달을 닫는다
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
function goMenu(){ if (EMBED){ try{ window.parent.postMessage({type:'feat-close'},'*'); }catch(e){} return; } location.href = MENU_URL; }
// 메뉴로 돌아가기 링크 + × close
(function(){
  const a = document.getElementById('back-menu'); if (a){ a.href = MENU_URL; a.onclick = (e)=>{ e.preventDefault(); goMenu(); }; }
  const x = document.getElementById('close-x');
  if (x) x.onclick = () => goMenu();
})();

// 이메일·인증코드 자동 저장 (localStorage) — 재방문 시 자동 prefill
const SAVE_KEY_PREFIX = 'visitor_save_';
function loadSavedEmail(serial) {
  try {
    const raw = localStorage.getItem(SAVE_KEY_PREFIX + serial);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.email ? d : null;
  } catch (e) { return null; }
}
function saveEmail(serial, email, verified, name, code) {
  try {
    const prev = JSON.parse(localStorage.getItem(SAVE_KEY_PREFIX + serial) || '{}') || {};
    const merged = { ...prev, email, verified: !!verified, savedAt: Date.now() };
    if (name) merged.name = name;
    if (code) merged.code = code;
    localStorage.setItem(SAVE_KEY_PREFIX + serial, JSON.stringify(merged));
  } catch (e) {}
}
function clearSavedEmail(serial) {
  try { localStorage.removeItem(SAVE_KEY_PREFIX + serial); } catch (e) {}
}
function showOnsiteConsent() {
  const consent = document.getElementById('onsite-consent');
  if (consent) {
    consent.classList.add('open');
    consent.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
function toggleOnsiteConsentAll(checked) {
  const terms = document.getElementById('onsite-consent-terms');
  const privacy = document.getElementById('onsite-consent-privacy');
  if (terms) terms.checked = checked;
  if (privacy) privacy.checked = checked;
  syncOnsiteConsent();
}
function syncOnsiteConsent() {
  const terms = !!document.getElementById('onsite-consent-terms')?.checked;
  const privacy = !!document.getElementById('onsite-consent-privacy')?.checked;
  const all = document.getElementById('onsite-consent-all');
  const next = document.getElementById('btn-onsite-consent');
  if (all) {
    all.checked = terms && privacy;
    all.indeterminate = terms !== privacy;
  }
  if (next) next.disabled = !(terms && privacy);
}
function acceptOnsiteConsent() {
  const terms = !!document.getElementById('onsite-consent-terms')?.checked;
  const privacy = !!document.getElementById('onsite-consent-privacy')?.checked;
  if (!(terms && privacy)) {
    alert('이용약관 및 개인정보 수집·이용에 모두 동의해 주세요.');
    return;
  }
  onsiteConsentAccepted = true;
  try { localStorage.setItem(`tracker_consent_${serial}`, '1'); } catch (e) {}
  if (onsiteConsentNextUrl) {
    location.href = onsiteConsentNextUrl;
    return;
  }
  const consent = document.getElementById('onsite-consent');
  if (consent) consent.style.display = 'none';
  const wrap = document.getElementById('others-wrap');
  if (wrap) {
    wrap.classList.remove('locked');
    wrap.style.display = 'block';
  }
  const btnSubmit = document.getElementById('btn-submit');
  if (btnSubmit) {
    btnSubmit.disabled = false;
    btnSubmit.style.display = 'block';
  }
  const msg = document.getElementById('verify-msg');
  if (msg) {
    msg.innerHTML = '✓ 이메일 인증 및 필수 동의 완료<br><b style="color:#15803d;">아래 현장등록 양식을 작성해 주세요.</b>';
    msg.className = 'verify-msg ok';
  }
}
let cfg = null;
let emailVerified = false;
let pendingCode = '';
let onsiteConsentAccepted = false;
let onsiteConsentNextUrl = '';

// ── PWA: 프로젝트별 manifest + 서비스워커 등록 + 설치 안내 ──
if (serial) {
  document.getElementById('manifest-link').setAttribute('href', `/api/visitor/manifest/${encodeURIComponent(serial)}`);
}
let deferredInstallPrompt = null;
const PWA_INSTALLED_KEY = `pwa_installed_${serial}`;
const isPwaStandalone = () => window.matchMedia('(display-mode: standalone)').matches || (window.navigator.standalone === true);
function rememberPwaInstalled() {
  try { localStorage.setItem(PWA_INSTALLED_KEY, '1'); } catch (e) {}
}
async function isPwaAlreadyInstalled() {
  if (isPwaStandalone()) {
    rememberPwaInstalled();
    return true;
  }
  try {
    if (localStorage.getItem(PWA_INSTALLED_KEY) === '1') return true;
  } catch (e) {}
  if ('getInstalledRelatedApps' in navigator) {
    try {
      const apps = await navigator.getInstalledRelatedApps();
      if (Array.isArray(apps) && apps.length > 0) {
        rememberPwaInstalled();
        return true;
      }
    } catch (e) {}
  }
  return false;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  refreshPwaInstallBox();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  rememberPwaInstalled();
  const box = document.getElementById('pwa-install-box');
  if (box) box.style.display = 'none';
});
// 서비스워커 등록 — visitor PWA 의 SW 와 스코프 공유
if ('serviceWorker' in navigator && serial) {
  navigator.serviceWorker.register(`/v/${serial}/sw.js`, { scope: `/v/${serial}/` }).catch(() => {});
}
// 완료 카드에서 PWA 설치 박스 표시 갱신
async function refreshPwaInstallBox() {
  const box = document.getElementById('pwa-install-box');
  if (!box) return;
  if (await isPwaAlreadyInstalled()) { box.style.display = 'none'; return; }
  box.style.display = '';
  const iosTip = document.getElementById('pwa-ios-tip');
  const isiOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (iosTip) iosTip.style.display = isiOS ? '' : 'none';
  const btn = document.getElementById('btn-pwa-install');
  if (btn) {
    btn.disabled = false;
    btn.style.opacity = '';
    btn.textContent = '📲 홈 화면에 앱 설치';
    
    btn.onclick = async () => {
      if (await isPwaAlreadyInstalled()) {
        box.style.display = 'none';
        return;
      }
      if (deferredInstallPrompt) {
        try {
          await deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          if (choice && choice.outcome === 'accepted') {
            rememberPwaInstalled();
            box.style.display = 'none';
          }
        } catch (e) {}
        deferredInstallPrompt = null;
      } else {
        alert(
          "※ 홈 화면에 앱 설치(추가) 방법 안내:\n\n" +
          "1. Android (크롬, 삼성 인터넷 등):\n" +
          "   브라우저 우측 상단 또는 하단의 메뉴(삼점 ⋮ 또는 ☰) 버튼을 누르고, '홈 화면에 추가' 또는 '앱 설치'를 선택해 주세요.\n\n" +
          "2. iOS (사파리 Safari):\n" +
          "   브라우저 하단의 '공유' 아이콘(네모에 위 화살표)을 누르고, 스크롤하여 '홈 화면에 추가'를 선택해 주세요."
        );
      }
    };
  }
}

function won(n) { return Number(n||0).toLocaleString('ko-KR') + '원'; }

// 옵션 row 선택 시 동기화 (radio 면 같은 그룹의 다른 row 도 해제)
function syncOptRow(input, fieldKey, isSingle) {
  if (isSingle) {
    document.querySelectorAll(`input[name="f-${fieldKey}"]`).forEach(el => {
      el.closest('.opt-row').classList.toggle('checked', el.checked);

// Kakao Maps SDK 동적 로드
let kakaoSdkPromise = null;
function loadKakaoSdk() {
  if (kakaoSdkPromise) return kakaoSdkPromise;
  kakaoSdkPromise = new Promise(async (resolve, reject) => {
    try {
      const r = await fetch('/api/integration/kakao/js-key');
      if (!r.ok) { reject(new Error('key_unavailable')); return; }
      const d = await r.json();
      if (!d.ok || !d.key) { reject(new Error('key_unavailable')); return; }
      const s = document.createElement('script');
      s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${d.key}&libraries=services&autoload=false`;
      s.onload = () => { try { kakao.maps.load(resolve); } catch (e) { reject(e); } };
      s.onerror = () => reject(new Error('sdk_load_failed'));
      document.head.appendChild(s);
    } catch (e) { reject(e); }
  });
  return kakaoSdkPromise;
}
// 부팅 시 미리 로드
loadKakaoSdk().catch(() => {});

// Daum Postcode 라이브러리 보장 로드
function ensurePostcodeLib() {
  return new Promise((resolve, reject) => {
    if (window.daum && window.daum.Postcode) { resolve(); return; }
    const existing = document.querySelector('script[src*="postcode.v2.js"]');
    if (existing) {
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('lib_load_failed')));
      setTimeout(() => {
        if (window.daum && window.daum.Postcode) resolve();
        else reject(new Error('lib_not_ready'));
      }, 200);
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('lib_load_failed'));
    document.head.appendChild(s);
  });
}

// 주소 검색 (embed 모드 — 풀스크린 오버레이)
async function openPostcode(fieldKey) {
  try { await ensurePostcodeLib(); }
  catch (e) {
    alert('주소 검색 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    return;
  }
  if (!window.daum || !window.daum.Postcode) {
    alert('주소 검색 라이브러리가 준비되지 않았습니다.');
    return;
  }
  const overlay = document.getElementById('pc-overlay');
  const frame = document.getElementById('pc-frame');
  frame.innerHTML = '';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    try {
      const pc = new daum.Postcode({
        autoClose: false,
        width: '100%',
        height: '100%',
        oncomplete: (data) => {
          document.getElementById(`f-${fieldKey}-zip`).value = data.zonecode || '';
          document.getElementById(`f-${fieldKey}-addr1`).value = data.roadAddress || data.jibunAddress || '';
          const detail = document.getElementById(`f-${fieldKey}-addr2`);
          const fullAddr = data.roadAddress || data.jibunAddress || '';
          closePostcode();
          renderAddressMap(fieldKey, fullAddr);
          if (detail) detail.focus();
        },
      });
      pc.embed(frame);
    } catch (e) {
      alert('주소 검색을 열지 못했습니다: ' + (e && e.message ? e.message : '알 수 없는 오류'));
      closePostcode();
    }
  });
}
function closePostcode() {
  const overlay = document.getElementById('pc-overlay');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('pc-frame').innerHTML = '';
}
async function renderAddressMap(fieldKey, fullAddr) {
  const mapEl = document.getElementById(`f-${fieldKey}-map`);
  if (!mapEl) return;
  const fallbackLink = `<a class="addr-map-link" href="https://map.kakao.com/?q=${encodeURIComponent(fullAddr)}" target="_blank" rel="noopener">🗺️ Kakao 지도에서 보기 — 📍 ${esc(fullAddr)}</a>`;
  mapEl.className = '';
  mapEl.style.cssText = '';
  try {
    await loadKakaoSdk();
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(fullAddr, (results, status) => {
      if (status !== kakao.maps.services.Status.OK || !results || !results.length) {
        mapEl.innerHTML = fallbackLink;
        return;
      }
      const r = results[0];
      const lat = parseFloat(r.y), lng = parseFloat(r.x);
      mapEl.innerHTML = '';
      const mapDiv = document.createElement('div');
      mapDiv.className = 'addr-map';
      mapEl.appendChild(mapDiv);
      const center = new kakao.maps.LatLng(lat, lng);
      const map = new kakao.maps.Map(mapDiv, { center, level: 3 });
      new kakao.maps.Marker({ position: center, map });
      const addrLabel = document.createElement('div');
      addrLabel.style.cssText = 'margin-top:6px;font-size:11px;color:#64748b;text-align:center;';
      addrLabel.textContent = '📍 ' + fullAddr;
      mapEl.appendChild(addrLabel);
    });
  } catch (e) {
    mapEl.innerHTML = fallbackLink;
  }
}

let verifiedCode = '';   // 인증 완료된 코드 (submit 시 함께 전송)

// 인증코드 마스킹 토글 (✱✱✱ ↔ 평문)
function toggleCodeReveal() {
  const inp = document.getElementById('f-code');
  const btn = document.getElementById('code-eye-btn');
  if (!inp || !btn) return;
  const showing = inp.classList.toggle('show-text');
  btn.textContent = showing ? '🙈' : '👁';
  btn.title = showing ? '코드 숨기기' : '코드 보기';
}
let sendCooldownTimer = null;
function startSendCooldown(seconds) {
  const btn = document.getElementById('btn-send');
  if (!btn) return;
  if (sendCooldownTimer) { clearInterval(sendCooldownTimer); sendCooldownTimer = null; }
  let left = Math.max(1, Math.floor(seconds));
  btn.disabled = true;
  btn.textContent = `재발송 (${left}초)`;
  sendCooldownTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(sendCooldownTimer); sendCooldownTimer = null;
      btn.disabled = false;
      btn.textContent = '재발송';
    } else {
      btn.textContent = `재발송 (${left}초)`;
    }
  }, 1000);
}

async function sendVerifyCode() {
  const email = (document.getElementById('f-email').value || '').trim();
  const msg = document.getElementById('verify-msg');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.textContent = '올바른 이메일을 입력해 주세요.'; msg.className = 'verify-msg err'; return;
  }
  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.textContent = '발송 중…';
  try {
    const r = await fetch('/api/integration/email-verify/send', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, project_serial: serial }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      if (d.error === 'rate_limited') {
        msg.textContent = '이전 발송 후 1분이 지나야 재발송할 수 있습니다.';
        msg.className = 'verify-msg err';
        startSendCooldown(60);
        return;
      }
      msg.textContent = d.message || '인증코드 발송에 실패했습니다.';
      msg.className = 'verify-msg err';
      btn.disabled = false; btn.textContent = '인증코드 발송';
      return;
    }
    const devNote = d.devCode ? ` <span style="color:#94a3b8;">(개발용 코드: <b>${d.devCode}</b>)</span>` : '';
    const alreadyNote = d.already_registered
      ? '<br><b style="color:#dc2626;">⚠ 이미 등록된 이메일입니다. 인증코드 확인 시 기존 데이터를 가져옵니다.</b>'
      : '';
    msg.innerHTML = `인증코드를 발송했습니다. 메일함(스팸함 포함)을 확인해 주세요. (유효시간 10분)${devNote}${alreadyNote}`;
    msg.className = 'verify-msg';
    startSendCooldown(60);
  } catch (e) {
    msg.textContent = '네트워크 오류로 발송에 실패했습니다.';
    msg.className = 'verify-msg err';
    btn.disabled = false; btn.textContent = '인증코드 발송';
  }
}
async function confirmVerifyCode() {
  const email = (document.getElementById('f-email').value || '').trim();
  const code = (document.getElementById('f-code').value || '').trim();
  const msg = document.getElementById('verify-msg');
  if (!code) { msg.textContent = '인증코드를 입력해 주세요.'; msg.className = 'verify-msg err'; return; }
  // 코드 검증 + 기존 신청 조회 (lookup) 한 번에
  let lookup;
  try {
    const r = await fetch(`/api/integration/projects/${encodeURIComponent(serial)}/reservations/lookup`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, code }),
    });
    lookup = await r.json();
    if (!r.ok || !lookup.ok) {
      msg.innerHTML = '인증코드가 일치하지 않거나 <b>유효시간(10분)이 만료</b>되었습니다.<br>인증코드 발송을 다시 눌러 새 코드를 받으세요.';
      msg.className = 'verify-msg err'; return;
    }
  } catch (e) {
    msg.textContent = '네트워크 오류로 확인에 실패했습니다.';
    msg.className = 'verify-msg err'; return;
  }
  // 이미 등록된 경우 → 확인 후 기존 데이터 노출 또는 현장등록의 경우 자동 로그인하여 이동
  if (lookup.found && lookup.reservation) {
    const remember = document.getElementById('f-remember');
    if (remember && remember.checked) {
      saveEmail(serial, email, true, lookup.reservation.fields?.name || '', code);
    } else {
      clearSavedEmail(serial);
    }

    if (mode === 'e') {
      emailVerified = true;
      verifiedCode = code;
      onsiteConsentNextUrl = sameOriginVisitorUrl(lookup.reservation.visitor_url);
      msg.innerHTML = '✓ 이메일 인증 완료<br><b style="color:#15803d;">필수 약관 동의 후 행사 입장 페이지로 이동합니다.</b>';
      msg.className = 'verify-msg ok';
      document.getElementById('f-email').disabled = true;
      document.getElementById('f-code').disabled = true;
      document.getElementById('btn-send').disabled = true;
      document.getElementById('btn-verify').disabled = true;
      showOnsiteConsent();
      return;
    }

    const proceed = window.confirm('이미 등록되었습니다.\n기존 데이타를 가져올까요?');
    if (proceed) {
      renderAlreadyRegistered(lookup.reservation);
    } else {
      // 다른 이메일로 재시도할 수 있도록 폼 리셋
      if (sendCooldownTimer) { clearInterval(sendCooldownTimer); sendCooldownTimer = null; }
      document.getElementById('f-email').disabled = false;
      document.getElementById('f-email').value = '';
      document.getElementById('f-code').disabled = false;
      document.getElementById('f-code').value = '';
      const sendBtn = document.getElementById('btn-send');
      sendBtn.disabled = false; sendBtn.textContent = '인증코드 발송';
      document.getElementById('btn-verify').disabled = false;
      msg.textContent = '다른 이메일로 다시 시도해 주세요.';
      msg.className = 'verify-msg';
      document.getElementById('f-email').focus();
    }
    return;
  }
  // 신규 → 폼 잠금 해제
  alert('최초 인증 통과 시 인증코드가 비밀번호로 활용됩니다.');
  emailVerified = true;
  verifiedCode = code;
  msg.innerHTML = '✓ 이메일 인증 완료' + (mode === 'e' ? '<br><b style="color:#15803d;">미등록 이메일입니다. 필수 약관 동의 후 현장등록을 계속해 주세요.</b>' : '');
  msg.className = 'verify-msg ok';
  document.getElementById('f-email').disabled = true;
  document.getElementById('f-code').disabled  = true;
  document.getElementById('btn-send').disabled = true;
  document.getElementById('btn-verify').disabled = true;
  // 자동 저장 옵션이 체크되어 있으면 localStorage 에 저장
  const remember = document.getElementById('f-remember');
  if (remember && remember.checked) saveEmail(serial, email, true, '', code);
  else clearSavedEmail(serial);

  if (mode === 'e') {
    showOnsiteConsent();
    return;
  }

  const wrap = document.getElementById('others-wrap');
  if (wrap) {
    wrap.classList.remove('locked');
    wrap.style.display = 'block';
  }
  const btnSubmit = document.getElementById('btn-submit');
  if (btnSubmit) {
    btnSubmit.disabled = false;
    btnSubmit.style.display = 'block';
  }
}

function renderAlreadyRegistered(rsv) {
  const won = n => Number(n||0).toLocaleString('ko-KR') + '원';
  const fmtDT = s => {
    if (!s) return '-';
    const d = new Date(s); if (isNaN(d)) return '-';
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };
  const f = rsv.fields || {};
  const rsvModeLabel = rsv.mode === 'reservation' ? '사전등록' : '현장등록';
  const statusBadge = (() => {
    if (rsv.status === 'used')      return '<span style="color:#166534;font-weight:700;">✓ Gift 사용 완료</span>';
    if (rsv.status === 'activated') return '<span style="color:#15803d;font-weight:700;">✓ 현장 방문 완료</span>';
    return '<span style="color:#92400e;font-weight:700;">신청 완료 (입장 전)</span>';
  })();
  const fieldRows = Object.entries(f).filter(([k,v]) => k !== 'email' && v != null && v !== '').map(([k,v]) => {
    const labelMap = { name:'이름', mobile:'모바일폰', birth_date:'생년월일', address:'주소',
      gender:'성별', age_group:'연령대', nationality:'국적', emergency_contact:'비상연락처',
      party_size:'동반 인원', visit_purpose:'방문 목적', car_number:'차량번호',
      preferred_time:'방문 희망 시간', company:'소속/회사', referral_source:'알게된 경로',
      newsletter_optin:'소식지 수신 동의' };
    const label = labelMap[k] || k;
    const val = Array.isArray(v) ? v.join(', ') : String(v);
    return `<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">
      <div style="width:110px;color:#64748b;flex-shrink:0;">${label}</div>
      <div style="color:#1e293b;flex:1;word-break:break-all;">${esc(val)}</div>
    </div>`;
  }).join('');

  document.getElementById('wrap').innerHTML = `
    <div class="header">
      <div class="title">${esc(rsv.project_name || '')}</div>
      <div class="mode-badge ${rsv.mode === 'reservation' ? 'r' : 'e'}">${esc(rsvModeLabel)}</div>
    </div>
    <div class="disabled-banner" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;">
      ⚠ 이미 등록된 가입자입니다.<br>아래는 이전에 등록하신 정보입니다.
    </div>
    <div class="done-card">
      <h2 style="color:#1e293b;">신청 정보</h2>
      <div style="text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;margin-bottom:14px;">
        ${fieldRows}
        <div style="display:flex;gap:10px;padding:8px 0 4px;font-size:12px;color:#94a3b8;">
          <div style="width:110px;">신청일시</div><div>${fmtDT(rsv.created_at)}</div>
        </div>
        ${rsv.activated_at ? `<div style="display:flex;gap:10px;padding:4px 0;font-size:12px;color:#94a3b8;"><div style="width:110px;">현장 방문</div><div>${fmtDT(rsv.activated_at)}</div></div>` : ''}
        ${rsv.used_at ? `<div style="display:flex;gap:10px;padding:4px 0;font-size:12px;color:#94a3b8;"><div style="width:110px;">Gift 사용</div><div>${fmtDT(rsv.used_at)}</div></div>` : ''}
        <div style="display:flex;gap:10px;padding:4px 0;font-size:12px;"><div style="width:110px;color:#94a3b8;">상태</div><div>${statusBadge}</div></div>
      </div>
      ${rsv.qr_image_url ? `<div class="qr-box"><img src="${rsv.qr_image_url}" alt="QR"></div>` : ''}
      <div class="btn-row">
        ${rsv.qr_image_url ? `<button class="btn-save" onclick="downloadQr('${rsv.qr_image_url}','existing')">💾 QR 저장</button>` : ''}
        <a class="btn-visit" href="${esc(sameOriginVisitorUrl(rsv.visitor_url))}">🚀 입장/활동 시작</a>
      </div>
      <p class="done-tip">동일 이메일로 다시 신청할 수 없습니다. 위 QR 또는 링크로 입장 절차를 진행해 주세요.</p>
      <!-- 메뉴로 돌아가기 -->
      <a href="${MENU_URL}" onclick="goMenu();return false" style="display:block;width:100%;margin-top:14px;padding:14px;background:#fff;border:1.5px solid #cbd5e1;color:#475569;border-radius:10px;text-align:center;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;">
        ◀ 메뉴로 돌아가기
      </a>
    </div>`;
}
async function onSubmit() {
  if (!emailVerified) { alert('이메일 인증을 완료해 주세요.'); return; }
  if (mode === 'e' && !onsiteConsentAccepted) {
    alert('이용약관 및 개인정보 수집·이용 동의를 완료해 주세요.');
    showOnsiteConsent();
    return;
  }
  // 필수 항목 검증
  const fieldsObj = { email: document.getElementById('f-email').value.trim() };
  const fields = cfg.fields || [];
  for (const f of fields) {
    if (f.field_key === 'email') continue;
    const el = document.getElementById('f-' + f.field_key);
    if (f.input_type === 'select') {
      const sel = Array.from(document.querySelectorAll(`input[name="f-${f.field_key}"]:checked`)).map(x => x.value);
      if (f.required && !sel.length) { alert(`${f.label} 항목을 선택해 주세요.`); return; }
      // single 이면 단일값으로, multi 면 배열로 저장
      fieldsObj[f.field_key] = (f.choice_type === 'single') ? (sel[0] || '') : sel;
    } else if (f.input_type === 'address') {
      const zip = document.getElementById(`f-${f.field_key}-zip`)?.value || '';
      const a1 = document.getElementById(`f-${f.field_key}-addr1`)?.value || '';
      const a2 = document.getElementById(`f-${f.field_key}-addr2`)?.value || '';
      const composed = [zip, a1, a2].filter(Boolean).join(' / ');
      if (f.required && !a1) { alert(`${f.label} 항목을 입력해 주세요.`); return; }
      fieldsObj[f.field_key] = composed;
    } else if (f.input_type === 'checkbox') {
      fieldsObj[f.field_key] = !!(el && el.checked);
      if (f.required && !fieldsObj[f.field_key]) { alert(`${f.label} 항목에 동의해 주세요.`); return; }
    } else {
      const v = (el && el.value || '').trim();
      if (f.required && !v) { alert(`${f.label} 항목을 입력해 주세요.`); return; }
      fieldsObj[f.field_key] = v;
    }
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = '처리 중…';

  try {
    const r = await fetch(`/api/integration/projects/${encodeURIComponent(serial)}/reservations/submit`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        mode: mode === 'r' ? 'reservation' : 'entry',
        fields: fieldsObj,
        email_verified: true,
        code: verifiedCode,
        terms_consented: mode === 'e' ? onsiteConsentAccepted : true,
        privacy_consented: mode === 'e' ? onsiteConsentAccepted : true,
      }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      const msgs = {
        already_registered: '이미 동일 이메일로 신청되어 있습니다.',
        limit_exceeded: '발급 한도 초과로 신청을 받을 수 없습니다.',
        reservation_window_closed: '사전등록 기간이 아닙니다.',
        entry_window_closed: '현장등록 기간이 아닙니다.',
        reservation_disabled: '사전등록이 비활성화되어 있습니다.',
        entry_disabled: '현장등록이 비활성화되어 있습니다.',
        consent_required: '이용약관 및 개인정보 수집·이용 동의를 완료해 주세요.',
      };
      alert(msgs[d.error] || d.message || '신청 처리에 실패했습니다.');
      btn.disabled = false; btn.textContent = modeLabel + ' 신청하기';
      return;
    }
    // 자동 저장 옵션 체크되어 있으면 이메일 + 이름 저장 → visitor 앱 자동 로그인용
    const remember = document.getElementById('f-remember');
    if (remember && remember.checked) {
      saveEmail(serial, fieldsObj.email, true, fieldsObj.name || '', verifiedCode);
    }
    renderDone(d);
  } catch (e) {
    alert('네트워크 오류로 신청에 실패했습니다.');
    btn.disabled = false; btn.textContent = modeLabel + ' 신청하기';
  }
}

  document.getElementById('wrap').innerHTML = `
    <div class="header">
      <div class="title">${esc(d.project.name || '')}</div>

    <div class="done-card">
      <h2>✓ 신청이 완료되었습니다</h2>
      <p style="font-size:13px;color:#475569;margin-bottom:10px;">아래 QR 코드를 휴대폰에 저장하세요.<br>현장에서 이 QR을 보여주시면 본 페이지 링크로 입장 및 활동을 진행할 수 있습니다.</p>
      <div class="qr-box"><img id="qr-img" src="${d.qr_image_url}" alt="QR 코드"></div>

      <div class="btn-row">

        <a class="btn-visit" href="${esc(sameOriginVisitorUrl(d.visitor_url))}">🚀 입장/활동 시작</a>
      </div>
      <p class="done-tip">※ 'QR 저장' 으로 휴대폰 갤러리에 저장한 후, 현장에서 'QR 저장' 으로 다운로드된 이미지나 본 페이지의 링크로 입장 절차를 진행할 수 있습니다.</p>

      <!-- PWA 설치 안내 -->
      <div id="pwa-install-box" style="display:none;margin-top:14px;padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:#166534;margin-bottom:6px;">📲 ${esc(d.project.name || '프로젝트')} 앱 설치</div>
        <div style="font-size:12px;color:#475569;line-height:1.5;margin-bottom:8px;">
          ${esc(d.project.name || '본 프로젝트')} 앱을 설치하면 등록 정보·QR·혜택을 한 곳에서 관리할 수 있습니다.
        </div>
        <button id="btn-pwa-install" style="width:100%;padding:11px;background:#15803d;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">📲 홈 화면에 앱 설치</button>
        <div id="pwa-ios-tip" style="display:none;margin-top:8px;font-size:11px;color:#64748b;line-height:1.5;">
          📱 iOS: Safari 하단 <b>공유 아이콘</b> → <b>"홈 화면에 추가"</b>
        </div>
      </div>

      <!-- 메뉴로 돌아가기 — 등록 완료 후 다른 기능(Tour/Quiz/설문)으로 이동 -->
      <a href="${MENU_URL}" onclick="goMenu();return false" style="display:block;width:100%;margin-top:14px;padding:14px;background:#fff;border:1.5px solid #cbd5e1;color:#475569;border-radius:10px;text-align:center;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;">
        ◀ 메뉴로 돌아가기
      </a>
    </div>`;
  // 완료 카드 표시 후 PWA 설치 안내 갱신
  refreshPwaInstallBox();
}

async function downloadQr(url, token) {
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    const burl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = burl; a.download = `qr_${token.slice(0, 12)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(burl);
  } catch (e) {
    window.open(url, '_blank');
  }
}
